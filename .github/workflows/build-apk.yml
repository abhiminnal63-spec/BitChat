name: BITCHAT Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # PRODUCTION RELEASE JOB (Triggered only when Git tags like v1.0.0 are pushed)
  # =========================================================================
  release:
    name: Build & Release Production APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract Tag Info
        id: tag_info
        run: |
          RAW_TAG="${{ github.ref_name }}"
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "Preparing Production Release for tag: $RAW_TAG"

      - name: Restore production keystore from GitHub Secret
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BITCHAT_KEYSTORE_BASE64 }}
        run: |
          echo "=== Restoring Production Keystore ==="
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_PATH="${KEYSTORE_DIR}/bitchat-release.jks"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "Production keystore successfully restored from GitHub Secrets."
          else
            echo "::warning::BITCHAT_KEYSTORE_BASE64 secret is not configured. Generating a fallback signing key for validation."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "${{ secrets.BITCHAT_KEY_ALIAS || 'bitchat' }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ secrets.BITCHAT_KEYSTORE_PASSWORD || 'android' }}" \
              -keypass "${{ secrets.BITCHAT_KEY_PASSWORD || 'android' }}" \
              -dname "CN=BITCHAT Production,O=BITCHAT,C=US"
          fi

          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Error: Keystore file missing or empty at $KEYSTORE_PATH"
            exit 1
          fi

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build production release APK
        env:
          BITCHAT_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          BITCHAT_KEYSTORE_PASSWORD: ${{ secrets.BITCHAT_KEYSTORE_PASSWORD || 'android' }}
          BITCHAT_KEY_ALIAS: ${{ secrets.BITCHAT_KEY_ALIAS || 'bitchat' }}
          BITCHAT_KEY_PASSWORD: ${{ secrets.BITCHAT_KEY_PASSWORD || 'android' }}
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify release APK and calculate SHA-256
        id: verify_apk
        run: |
          echo "=== Verifying Production Release APK ==="
          TAG="${{ steps.tag_info.outputs.tag }}"
          
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Error: Production release APK not found in app/build/outputs/apk/release/"
            exit 1
          fi
          
          if [ ! -s "$APK_FILE" ]; then
            echo "Error: Output APK is empty."
            exit 1
          fi
          
          # Calculate SHA-256 checksum
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "Verified APK: $APK_FILE ($FILE_SIZE bytes)"
          echo "SHA-256 Checksum: $SHA256"
          
          # Format predictable naming for releases & website downloads: BITCHAT-<tag>.apk (e.g., BITCHAT-v1.0.0.apk)
          ASSET_DIR="${RUNNER_TEMP}/release_assets"
          mkdir -p "$ASSET_DIR"
          ASSET_NAME="BITCHAT-${TAG}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          cp "$APK_FILE" "$ASSET_PATH"
          
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$FILE_SIZE" >> "$GITHUB_OUTPUT"

      - name: Securely Clean Up Keystore
        if: always()
        run: |
          echo "=== Cleaning Up Decoded Keystore Files ==="
          if [ -d "${RUNNER_TEMP}/keystore" ]; then
            rm -rf "${RUNNER_TEMP}/keystore"
            echo "Keystore directory safely removed from runner."
          fi

      - name: Upload production release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify_apk.outputs.asset_name }}
          path: ${{ steps.verify_apk.outputs.asset_path }}
          if-no-files-found: error

      - name: Publish Production GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag_info.outputs.tag }}"
          TITLE="BITCHAT ${TAG}"
          ASSET_PATH="${{ steps.verify_apk.outputs.asset_path }}"
          ASSET_NAME="${{ steps.verify_apk.outputs.asset_name }}"
          SHA256="${{ steps.verify_apk.outputs.sha256 }}"
          SIZE_BYTES="${{ steps.verify_apk.outputs.size }}"
          
          RELEASE_NOTES=$(cat << EOF
          # 🚀 BITCHAT ${TAG} — Production Release
          
          Official production release build for **BITCHAT**.
          
          ---
          
          ### 📦 Release Package Details
          - **Application ID:** \`com.aistudio.easapp.vxbtzq\`
          - **Release Tag:** \`${TAG}\`
          - **Artifact Name:** \`${ASSET_NAME}\`
          - **File Size:** \`${SIZE_BYTES} bytes\`
          - **Commit SHA:** \`${{ github.sha }}\`
          
          ---
          
          ### 🔒 Checksum & Verification (SHA-256)
          \`\`\`text
          ${SHA256}
          \`\`\`
          
          ---
          
          ### 📲 Installation Instructions
          1. Download **\`${ASSET_NAME}\`** from the **Assets** section below.
          2. Open the downloaded APK on your Android device running Android 7.0+ (API 24+).
          3. Confirm installation or update when prompted.
          EOF
          )
          
          echo "Creating GitHub Release $TAG..."
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Summary
        if: always()
        run: |
          TAG="${{ steps.tag_info.outputs.tag }}"
          ASSET_NAME="${{ steps.verify_apk.outputs.asset_name }}"
          SHA256="${{ steps.verify_apk.outputs.sha256 }}"
          
          echo "### 🚀 BITCHAT Production Release Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag:** \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release APK:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA-256 Checksum:** \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Page:** [https://github.com/${{ github.repository }}/releases/tag/${TAG}](https://github.com/${{ github.repository }}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # DEBUG BUILD JOB (Triggered on normal main branch commits & PRs)
  # =========================================================================
  debug:
    name: Build Debug APK
    if: !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "Error: Debug APK not found."
            exit 1
          fi
          echo "Debug APK verified: $DEBUG_APK"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChat-debug-build
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
