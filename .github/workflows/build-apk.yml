name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set!"
            exit 1
          fi
          
          RAW_VERSION=$(java -version 2>&1 | head -n 1)
          echo "Detected raw version string: $RAW_VERSION"
          
          JAVA_MAJOR=$(echo "$RAW_VERSION" | sed -E 's/.*version "([0-9]+).*/\1/')
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            # Handle possible 1.8.x format
            JAVA_MAJOR=$(echo "$RAW_VERSION" | sed -E 's/.*version "1\.([0-9]+).*/\1/')
          fi
          
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to detect active Java major version from '$RAW_VERSION'."
            exit 1
          fi
          
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_MAJOR) is lower than the required Java 17."
            exit 1
          fi
          echo "Java version verification passed ($JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore was not created successfully."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file at $EXPECTED_APK is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: Expected file does not have .apk extension."
              exit 1
              ;;
          esac
          
          echo "Debug APK successfully verified at $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$ORIGINAL_APK" ] || [ ! -s "$ORIGINAL_APK" ]; then
            echo "Error: Original APK is missing or empty."
            exit 1
          fi
          
          ASSET_DIR="${RUNNER_TEMP}/apk_release_assets"
          mkdir -p "$ASSET_DIR"
          
          RAW_REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}')
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi
          
          ASSET_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DESTINATION_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          
          cp "$ORIGINAL_APK" "$DESTINATION_PATH"
          
          if [ ! -f "$DESTINATION_PATH" ] || [ ! -s "$DESTINATION_PATH" ]; then
            echo "Error: Failed to prepare release asset at $DESTINATION_PATH"
            exit 1
          fi
          
          echo "asset_path=${DESTINATION_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DESTINATION_PATH ($ASSET_FILENAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI & Asset ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset '$ASSET_PATH' does not exist or is empty."
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset is not an APK file."
              exit 1
              ;;
          esac
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat << 'EOF'
          ### 📱 Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** #${{ github.run_number }}
          - **Run Attempt:** #${{ github.run_attempt }}
          - **Commit SHA:** `${{ github.sha }}`
          - **Build Artifact:** `${{ steps.prepare_asset.outputs.asset_name }}`

          > ⚠️ **Notice:** This APK is intended for testing and development purposes. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )
          
          echo "Publishing release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --notes "$RELEASE_NOTES" \
            --latest
          
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Release & Download Summary ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          TAG="${{ steps.publish_release.outputs.tag }}"
          TITLE="${{ steps.publish_release.outputs.title }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            gh release view "$TAG" || true
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            
            echo "### 🚀 Debug APK Build & Release Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Release Title:** $TITLE" >> "$GITHUB_STEP_SUMMARY"
            echo "**Release Tag:** \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "**Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "**Direct Download:** Download \`$ASSET_NAME\` directly from the **Assets** section of the [Release Page]($RELEASE_URL)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available in the workflow summary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was skipped or encountered an error."
            echo "The APK was successfully built and is safely preserved as a GitHub Actions artifact."
            echo "Actions artifact name: app-debug-apk"
            
            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built successfully, but publishing to GitHub Releases encountered an issue." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **Download Instructions:** You can download the verified APK artifact named **\`app-debug-apk\`** directly from the **Artifacts** section at the bottom of this GitHub Actions run summary." >> "$GITHUB_STEP_SUMMARY"
          fi
